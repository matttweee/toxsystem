<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOX SYSTEM · DEMO</title><link rel="icon" href="/static/logo.svg" type="image/svg+xml"><style>:root{--g:#72c900;--bg:#0c0e0d;--c:#171a18;--l:#2a302c;--t:#fff;--m:#9ba19d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.w{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.brand img{width:145px;height:auto;display:block;background:#fff;border-radius:8px;padding:5px}.pill{padding:7px 10px;border:1px solid var(--l);border-radius:99px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:18px}.big{font-size:30px;font-weight:1000}.lab{font-size:11px;color:var(--m);letter-spacing:.08em}.panel{margin:12px 0}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:5px}.field input,.field select{width:100%;background:#0f1110;border:1px solid var(--l);color:#fff;padding:13px;border-radius:10px}.btn{background:linear-gradient(90deg,var(--g),#ffd633);border:0;padding:13px 18px;border-radius:10px;font-weight:900;cursor:pointer}.danger{background:#672;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.gate{max-width:760px;margin:38px auto;background:#171a18;border:1px solid #2a302c;border-radius:22px;padding:30px}.gate h1{margin:16px 0 8px}.gate .controls{grid-template-columns:1fr 1fr}.hidden{display:none!important}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--l);font-size:12px;text-align:left}.muted{color:var(--m)}@media(max-width:800px){.grid,.controls,.gate .controls{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.controls,.gate .controls{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="top"><div class="brand"><img src="/static/logo.svg" alt="TOX SYSTEM"></div><div id="conn" class="pill">...</div></div><div id="gate" class="gate"><h1>Collega Bybit DEMO</h1><p class="muted">Inserisci solo le API del tuo account Bybit DEMO.</p><div class="controls"><div class="field"><label>API KEY BYBIT DEMO</label><input id="bind_key" autocomplete="off"></div><div class="field"><label>API SECRET BYBIT DEMO</label><input id="bind_secret" type="password" autocomplete="off"></div></div><div class="row"><button class="btn" onclick="bindBybit()">VERIFICA E ATTIVA DEMO</button></div><div id="gate_msg" class="muted" style="margin-top:12px">UID e licenza TOX vengono verificati automaticamente.</div></div><div id="dashboard" class="hidden"><div class="grid"><div class="card"><div class="lab">EQUITY DEMO</div><div id="eq" class="big">—</div></div><div class="card"><div class="lab">AVAILABLE</div><div id="av" class="big">—</div></div><div class="card"><div class="lab">BYBIT / UID</div><div id="bybit" class="big">—</div><div id="uid" class="muted"></div></div><div class="card"><div class="lab">STRATEGY SERVER</div><div id="srv" class="big">—</div></div></div><div class="panel"><h2>CONTROLLO</h2><div class="controls"><div class="field"><label>LEVA</label><select id="lev"><option>1</option><option>3</option><option selected>5</option><option>10</option></select></div><div class="field"><label>CAPITALE / POSIZIONE</label><select id="cap"><option>10</option><option>25</option></select></div><div class="field"><label>MAX POSIZIONI</label><select id="max"><option>1</option><option>3</option><option>5</option><option selected>10</option></select></div><div class="field"><label>PROTEZIONE C AUTO EXIT</label><select id="cauto"><option value="false">OFF</option><option value="true">ON</option></select></div></div><div class="row"><button class="btn" onclick="save()">SALVA</button><button class="btn" onclick="test()">TEST BYBIT</button><button class="btn" onclick="trade('on')">TRADING ON</button><button class="btn danger" onclick="trade('off')">TRADING OFF</button></div><div id="msg" class="muted" style="margin-top:10px"></div></div><div class="panel"><h2>OPEN POSITIONS</h2><div style="overflow:auto"><table><thead><tr><th>ASSET</th><th>SIDE</th><th>LEVERAGE</th><th>SIZE</th><th>ENTRY</th><th>PNL</th></tr></thead><tbody id="pos"></tbody></table></div></div><div class="panel"><h2>HISTORY</h2><div style="overflow:auto"><table><thead><tr><th>TIME</th><th>TYPE</th><th>ASSET</th><th>QTY</th><th>DETAIL</th></tr></thead><tbody id="hist"></tbody></table></div></div></div></div><script>let first=true;async function load(){let d=await fetch('/api/status').then(r=>r.json());let bound=!!d.settings.bound;gate.classList.toggle('hidden',bound);dashboard.classList.toggle('hidden',!bound);conn.textContent=bound?(d.settings.trading?'TRADING ON':'TRADING OFF'):'ATTIVAZIONE RICHIESTA';if(!bound)return;eq.textContent=(d.equity||0).toFixed(2)+' USDT';av.textContent=(d.available||0).toFixed(2)+' USDT';bybit.textContent=d.bybit_status;srv.textContent=d.server_status;uid.textContent=d.settings.bybit_uid?'UID '+d.settings.bybit_uid:'';if(first){lev.value=d.settings.leverage;cap.value=d.settings.capital_pct;max.value=d.settings.max_positions;cauto.value=String(d.settings.c_auto_exit);first=false}pos.innerHTML=(d.positions||[]).map(p=>`<tr><td>${p.symbol}</td><td>${p.side}</td><td>${p.leverage}x</td><td>${p.size}</td><td>${p.avgPrice}</td><td>${p.unrealisedPnl}</td></tr>`).join('')||'<tr><td colspan=6 class=muted>Nessuna posizione aperta</td></tr>';hist.innerHTML=(d.history||[]).slice().reverse().map(h=>`<tr><td>${new Date((h.time||0)*1000).toLocaleString()}</td><td>${h.type||''}</td><td>${h.symbol||''}</td><td>${h.qty||''}</td><td>${h.error||h.order||''}</td></tr>`).join('')||'<tr><td colspan=5 class=muted>Nessun evento ancora</td></tr>';if(d.last_error)msg.textContent=d.last_error}async function bindBybit(){gate_msg.textContent='Verifica in corso...';let body={api_key:bind_key.value.trim(),api_secret:bind_secret.value.trim()};try{let r=await fetch('/api/bind-auto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.detail||'Attivazione fallita');gate_msg.textContent='DEMO ATTIVATA · UID '+d.bybit_uid;bind_secret.value='';setTimeout(load,700)}catch(e){gate_msg.textContent=e.message}}async function save(){let body={leverage:+lev.value,capital_pct:+cap.value,max_positions:+max.value,c_auto_exit:cauto.value==='true'};let r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});msg.textContent=r.ok?'Configurazione salvata':'Errore configurazione';load()}async function test(){try{let r=await fetch('/api/test-bybit',{method:'POST'}),d=await r.json();if(!r.ok)throw Error(d.detail||'TEST_FAILED');msg.textContent='BYBIT DEMO CONNESSO · UID '+d.bybit_uid+' · Equity '+d.equity}catch(e){msg.textContent=e.message}}async function trade(m){let r=await fetch('/api/trading/'+m,{method:'POST'});if(!r.ok){let d=await r.json();msg.textContent=d.detail||'Errore'}load()}load();setInterval(load,3000)</script></body></html>

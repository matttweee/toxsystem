name: Build TOX Windows Installer
on:
  push:
    paths:
      - '.github/workflows/build-tox-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare source
        shell: pwsh
        run: |
          Copy-Item 'client-v006' 'appsrc' -Recurse -Force
          Copy-Item 'logo-tox.svg' 'appsrc/tox_client/static/logo.svg' -Force
          $app = Get-Content 'appsrc/tox_client/app.py' -Raw
          $app = $app.Replace("uvicorn.run(app,host='127.0.0.1',port=8791,log_level='warning')", "uvicorn.run(app,host='127.0.0.1',port=8791,log_level='warning',log_config=None,access_log=False)")
          Set-Content 'appsrc/tox_client/app.py' $app -Encoding UTF8
      - name: Install build tools
        shell: pwsh
        run: |
          pip install -r appsrc/requirements.txt
          pip install pyinstaller pillow
          choco install nsis -y --no-progress
      - name: Create icon
        shell: pwsh
        run: |
          @'
          import re,base64,io
          from PIL import Image
          s=open('appsrc/tox_client/static/logo.svg',encoding='utf-8').read()
          m=re.search(r'base64,([^\"]+)',s)
          img=Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGBA')
          img.thumbnail((232,232))
          c=Image.new('RGBA',(256,256),(255,255,255,255))
          c.alpha_composite(img,((256-img.width)//2,(256-img.height)//2))
          c.save('appsrc/tox.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content appsrc/make_icon.py -Encoding UTF8
          python appsrc/make_icon.py
      - name: Build app
        shell: pwsh
        working-directory: appsrc
        run: pyinstaller --noconfirm --clean --onedir --windowed --name TOX_SYSTEM_V006 --icon tox.ico --add-data 'tox_client/static;tox_client/static' --collect-all keyring --collect-all cryptography --hidden-import uvicorn.logging run.py
      - name: Build installer
        shell: pwsh
        run: |
          @'
          Unicode true
          !include "MUI2.nsh"
          Name "TOX SYSTEM Demo"
          OutFile "TOX_SETUP_V006.exe"
          InstallDir "$LOCALAPPDATA\Programs\TOX SYSTEM V006"
          RequestExecutionLevel user
          !define MUI_ICON "appsrc\tox.ico"
          !define MUI_FINISHPAGE_RUN "$INSTDIR\TOX_SYSTEM_V006.exe"
          !define MUI_FINISHPAGE_RUN_TEXT "Avvia TOX SYSTEM"
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "Italian"
          Section
            SetOutPath "$INSTDIR"
            File /r "appsrc\dist\TOX_SYSTEM_V006\*"
            CreateShortcut "$DESKTOP\TOX SYSTEM.lnk" "$INSTDIR\TOX_SYSTEM_V006.exe"
          SectionEnd
          '@ | Set-Content installer.nsi -Encoding UTF8
          & 'C:\Program Files (x86)\NSIS\makensis.exe' installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: TOX_SETUP_V006
          path: TOX_SETUP_V006.exe

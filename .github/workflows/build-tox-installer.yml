name: Build TOX Windows Installer

on:
  push:
    paths:
      - '.github/workflows/build-tox-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recreate client source
        shell: pwsh
        run: |
          $b64 = Get-Content 'downloads/TOX_CLIENT_DEMO_V003.zip.b64' -Raw
          [IO.File]::WriteAllBytes('TOX_CLIENT_DEMO_V003.zip',[Convert]::FromBase64String($b64.Trim()))
          Expand-Archive -Path 'TOX_CLIENT_DEMO_V003.zip' -DestinationPath 'buildsrc' -Force
          Copy-Item 'buildsrc/TOX_CLIENT_DEMO_V003' 'appsrc' -Recurse -Force
          if (-not (Test-Path 'appsrc/tox_client/static/index.html')) { throw 'Client static files missing after extraction' }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r appsrc/requirements.txt
          pip install pyinstaller pillow
          choco install nsis -y --no-progress

      - name: Create TOX icon
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw
          img=Image.new('RGBA',(256,256),(11,13,12,255))
          d=ImageDraw.Draw(img)
          green=(114,201,0,255)
          d.rounded_rectangle((18,18,238,238),radius=46,fill=(11,13,12,255),outline=green,width=10)
          d.rectangle((52,58,204,88),fill=green)
          d.rectangle((113,58,143,202),fill=green)
          img.save('appsrc/tox.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 appsrc/make_icon.py
          python appsrc/make_icon.py

      - name: Build native app
        shell: pwsh
        working-directory: appsrc
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name TOX_SYSTEM --icon tox.ico --add-data 'tox_client/static;tox_client/static' --collect-all keyring --collect-all cryptography run.py

      - name: Build installer
        shell: pwsh
        run: |
          @'
          Unicode true
          !include "MUI2.nsh"
          Name "TOX SYSTEM Demo"
          OutFile "TOX_SETUP_V004.exe"
          InstallDir "$LOCALAPPDATA\Programs\TOX SYSTEM"
          RequestExecutionLevel user
          BrandingText "TOX SYSTEM"
          !define MUI_ABORTWARNING
          !define MUI_ICON "appsrc\tox.ico"
          !define MUI_UNICON "appsrc\tox.ico"
          !define MUI_FINISHPAGE_RUN "$INSTDIR\TOX_SYSTEM.exe"
          !define MUI_FINISHPAGE_RUN_TEXT "Avvia TOX SYSTEM"
          !define MUI_FINISHPAGE_NOREBOOTSUPPORT
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "Italian"

          Section "Installa TOX SYSTEM" SecMain
            SetOutPath "$INSTDIR"
            File /r "appsrc\dist\TOX_SYSTEM\*"
            WriteUninstaller "$INSTDIR\Disinstalla TOX SYSTEM.exe"
            CreateDirectory "$SMPROGRAMS\TOX SYSTEM"
            CreateShortcut "$SMPROGRAMS\TOX SYSTEM\TOX SYSTEM.lnk" "$INSTDIR\TOX_SYSTEM.exe" "" "$INSTDIR\TOX_SYSTEM.exe" 0
            CreateShortcut "$SMPROGRAMS\TOX SYSTEM\Disinstalla TOX SYSTEM.lnk" "$INSTDIR\Disinstalla TOX SYSTEM.exe"
            CreateShortcut "$DESKTOP\TOX SYSTEM.lnk" "$INSTDIR\TOX_SYSTEM.exe" "" "$INSTDIR\TOX_SYSTEM.exe" 0
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TOX SYSTEM" "DisplayName" "TOX SYSTEM Demo"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TOX SYSTEM" "UninstallString" '"$INSTDIR\Disinstalla TOX SYSTEM.exe"'
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TOX SYSTEM" "DisplayVersion" "0.0.4"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TOX SYSTEM" "Publisher" "TOX SYSTEM"
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\TOX SYSTEM.lnk"
            Delete "$SMPROGRAMS\TOX SYSTEM\TOX SYSTEM.lnk"
            Delete "$SMPROGRAMS\TOX SYSTEM\Disinstalla TOX SYSTEM.lnk"
            RMDir "$SMPROGRAMS\TOX SYSTEM"
            RMDir /r "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TOX SYSTEM"
          SectionEnd
          '@ | Set-Content -Encoding UTF8 installer.nsi
          & 'C:\Program Files (x86)\NSIS\makensis.exe' installer.nsi

      - name: Publish installer to repository
        shell: pwsh
        run: |
          $bytes=[IO.File]::ReadAllBytes('TOX_SETUP_V004.exe')
          [IO.File]::WriteAllText('downloads/TOX_SETUP_V004.exe.b64',[Convert]::ToBase64String($bytes))
          $hash=(Get-FileHash 'TOX_SETUP_V004.exe' -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText('downloads/TOX_SETUP_V004.sha256.txt',$hash)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/TOX_SETUP_V004.exe.b64 downloads/TOX_SETUP_V004.sha256.txt
          git commit -m 'Publish TOX Windows installer V004' || echo 'No changes'
          git push

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOX_SETUP_V004
          path: TOX_SETUP_V004.exe

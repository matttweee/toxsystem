name: Insert wallet proof section
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert section
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="wallet-proof"' in s:
              print('already present')
              raise SystemExit(0)
          marker='<section class="section" id="verify">'
          if marker not in s:
              raise SystemExit('verify marker not found')
          section='''<section class="section" id="wallet-proof" style="background:radial-gradient(circle at 85% 0,#72c90018,transparent 30%),#fff"><div class="wrap"><div class="head"><div><div class="kicker">Replay storico sealed · 2021–2026</div><h2>DA €1.000 A<br><span class="green">€839.111.306</span></h2></div><p class="sub">Applicando senza reset annuali il flow congelato al replay storico dichiarato, il portafoglio modellato parte da €1.000 e termina a €839.111.306. Il dato è storico/simulato: non rappresenta capitale reale detenuto oggi e non garantisce risultati futuri.</p></div><div style="background:#0d100e;color:#fff;border-radius:28px;padding:28px;border:1px solid #252a27"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px"><div style="background:#171a18;border:1px solid #2a302c;border-radius:18px;padding:18px"><div class="kicker">CAPITALE INIZIALE</div><div style="font-size:38px;font-weight:1000;letter-spacing:-.045em;margin-top:7px">€1.000</div></div><div style="background:#171a18;border:1px solid #2a302c;border-radius:18px;padding:18px"><div class="kicker">CAPITALE FINALE</div><div style="font-size:38px;font-weight:1000;letter-spacing:-.045em;margin-top:7px;color:var(--lime)">€839,1M</div></div><div style="background:#171a18;border:1px solid #2a302c;border-radius:18px;padding:18px"><div class="kicker">PICCO</div><div style="font-size:38px;font-weight:1000;letter-spacing:-.045em;margin-top:7px">≈ €847,8M</div></div><div style="background:#171a18;border:1px solid #2a302c;border-radius:18px;padding:18px"><div class="kicker">MAX DRAWDOWN</div><div style="font-size:38px;font-weight:1000;letter-spacing:-.045em;margin-top:7px;color:#ffd633">≈ 53,7%</div></div><div style="background:#171a18;border:1px solid #2a302c;border-radius:18px;padding:18px"><div class="kicker">STARVATION</div><div style="font-size:38px;font-weight:1000;letter-spacing:-.045em;margin-top:7px">0</div></div><div style="background:#171a18;border:1px solid #2a302c;border-radius:18px;padding:18px"><div class="kicker">CAP REJECTS</div><div style="font-size:38px;font-weight:1000;letter-spacing:-.045em;margin-top:7px">2.828</div></div></div><div style="margin-top:24px;border-top:1px solid #2a302c;padding-top:20px"><div class="kicker">Percorso del portafoglio</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px"><div><span style="color:#8e9891;font-size:11px">START</span><br><b>€1.000</b></div><div><span style="color:#8e9891;font-size:11px">2021</span><br><b>€6.497</b></div><div><span style="color:#8e9891;font-size:11px">2022</span><br><b>€15.684</b></div><div><span style="color:#8e9891;font-size:11px">2023</span><br><b>€180.355</b></div><div><span style="color:#8e9891;font-size:11px">2024</span><br><b>€11.522.409</b></div><div><span style="color:#8e9891;font-size:11px">2025</span><br><b>€257.949.186</b></div><div><span style="color:#8e9891;font-size:11px">2026</span><br><b style="color:var(--lime)">€839.111.306</b></div></div></div></div><div class="btns"><a class="btn primary" href="/proof.html">VEDI LA PROVA AI →</a><a class="btn outline" href="/downloads/TOX_AI_VERIFICATION_PACK_V001.zip" download>↓ SCARICA AI VERIFICATION PACK</a></div><p class="tiny" style="margin-top:14px">Il report disponibile indica il massimo drawdown, ma non pubblica il valore esatto del minimo assoluto dell'equity lungo tutto il percorso: per questo non viene inventato né mostrato. Il risultato è un replay storico modellato con compounding e assunzioni dichiarate, non un conto reale né una promessa di rendimento.</p></div></section>'''
          s=s.replace(marker,section+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add sealed wallet proof section"
          git push
